<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>護照本 · 泰國行程表</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--paper:#fdfaf3;--ink:#2b2b2b;--sub:#8b8271;--dim:#a2977f;--edge:#e3d9c4;
 --gold:#b8860b;--gold2:#e8c275;--teal:#0e6b6b;--stamp:#b0392b;--spine:#d9cdb2}
body{font-family:'Helvetica Neue','Microsoft JhengHei',sans-serif;
 background:radial-gradient(circle at 25% 8%,#2b4746,#15272c 55%,#0a1215);
 min-height:100vh;display:flex;flex-direction:column;align-items:center;
 padding:10px 12px 16px;color:var(--ink);overflow:hidden}

/* ---------- top tabs ---------- */
.topbar{width:100%;max-width:min(600px,96vw);display:flex;gap:5px;flex-wrap:wrap;
 justify-content:center;padding:2px 0 12px;align-items:center}
.tab{border:1px solid #ffffff26;background:#ffffff10;color:#c9d8d6;border-radius:16px;
 padding:5px 12px;font-size:11.5px;cursor:pointer;transition:.22s;font-weight:600;
 backdrop-filter:blur(4px)}
.tab:hover{background:#ffffff20}
.tab.on{background:linear-gradient(120deg,var(--gold),var(--gold2));color:#20160a;
 border-color:transparent;box-shadow:0 3px 14px #b8860b55}

/* ---------- book ---------- */
.stage{perspective:2600px;width:min(420px,92vw);height:min(680px,76vh);position:relative}
.book{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.page{position:absolute;inset:0;background:var(--paper);border-radius:5px 13px 13px 5px;
 box-shadow:0 20px 55px rgba(0,0,0,.6),inset 9px 0 16px -9px rgba(0,0,0,.28);
 transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden;
 transition:transform .9s cubic-bezier(.58,.04,.3,1);overflow:hidden;
 border-left:9px solid var(--spine)}
.page.flipped{transform:rotateY(-174deg)}
.page::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
 background:repeating-linear-gradient(0deg,transparent 0 26px,rgba(0,0,0,.018) 26px 27px)}
.pg-in{position:absolute;inset:0;padding:20px 18px;overflow-y:auto;
 -webkit-overflow-scrolling:touch;z-index:2;
 display:flex;flex-direction:column;justify-content:safe center}
.pg-in::-webkit-scrollbar{width:0}

/* ---------- cover ---------- */
.cover{background:
 repeating-linear-gradient(48deg,#0000 0 3px,#ffffff05 3px 4px),
 radial-gradient(circle at 30% 18%,#1d514a,#123a35 55%,#0b2622);
 border-left:9px solid #0a221e;color:var(--gold2)}
.cv{position:absolute;inset:15px;border:1.5px solid #b8860b66;border-radius:4px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:24px 18px;text-align:center;z-index:3}
.cv::before,.cv::after{content:'';position:absolute;left:13px;right:13px;height:1px;
 background:linear-gradient(90deg,transparent,#b8860b88,transparent)}
.cv::before{top:8px}.cv::after{bottom:8px}
.emblem{width:78px;height:78px;border:2px solid #b8860b88;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:35px;margin-bottom:18px;
 background:radial-gradient(circle,#b8860b22,transparent 70%)}
.gold{background:linear-gradient(105deg,#8a6414,#f4dc9a 42%,#e8c275 58%,#8a6414);
 -webkit-background-clip:text;background-clip:text;color:transparent}
.cv .pp{font-size:22px;letter-spacing:8px;font-weight:800}
.cv .th{font-size:9.5px;letter-spacing:2px;opacity:.55;margin-top:5px}
.cv .rule{width:54px;height:1px;background:#b8860b77;margin:18px 0}
.cv .tt{font-size:22px;font-weight:900;letter-spacing:1px;line-height:1.45}
.cv .sb{font-size:11.5px;opacity:.62;margin-top:7px;letter-spacing:2px}
.cv .dd{font-size:11.5px;letter-spacing:3px;margin-top:20px;opacity:.8}
.chip{width:34px;height:26px;border-radius:4px;margin-top:24px;
 background:linear-gradient(135deg,#d9b45e,#8a6414);opacity:.75;position:relative}
.chip::after{content:'';position:absolute;inset:5px;border:1px solid #00000033;border-radius:2px}
.cv .who{font-size:11px;letter-spacing:6px;opacity:.6;margin-top:13px;font-weight:700}
.cv .tap{font-size:10px;opacity:.4;margin-top:20px;letter-spacing:2px;animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}

/* ---------- page chrome ---------- */
.pp-head{display:flex;justify-content:space-between;align-items:flex-start;
 border-bottom:2px solid var(--edge);padding-bottom:9px}
.pp-brand{font-size:8px;letter-spacing:2.4px;color:var(--dim);line-height:1.7;text-align:right}
.kicker{font-size:8px;letter-spacing:3px;color:var(--dim)}
.dayno{font-size:38px;font-weight:900;line-height:.94;color:var(--teal);letter-spacing:-1.5px}
.date{font-size:13px;color:var(--sub);margin-top:5px}
.theme{font-size:15.5px;font-weight:800;margin:10px 0 5px;color:#1f3b3b;line-height:1.4}
.hotel-tag{display:inline-block;font-size:11.5px;background:#efe6d2;color:#7a6a45;
 padding:3px 9px;border-radius:10px;margin-bottom:9px}
.stamp{position:absolute;top:66px;right:13px;width:84px;height:84px;
 border:3px double var(--stamp);border-radius:50%;color:var(--stamp);opacity:.26;
 transform:rotate(-15deg);display:flex;flex-direction:column;align-items:center;
 justify-content:center;font-size:7.5px;letter-spacing:1px;text-align:center;
 line-height:1.5;pointer-events:none;z-index:1}
.stamp b{font-size:15px;letter-spacing:0}
.row{display:grid;grid-template-columns:64px 1fr;gap:0 10px;padding:11px 0;
 border-bottom:1px dashed var(--edge);position:relative;z-index:2}
.row:last-child{border-bottom:none}
.tm{font-size:12px;font-weight:800;color:var(--gold);text-align:right;padding-top:2px;line-height:1.4}
.ac{font-size:14.5px;font-weight:700;line-height:1.45}
.lc{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}
.nt{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.65}
.row.f .ac{color:#9c5710}
.row.f .tm{color:#c0731a}

/* ---------- flight / hotel ---------- */
.fl{border:1px dashed #cdbf9f;border-radius:10px;padding:13px;margin-top:13px;
 background:#fffdf7;position:relative}
.fl::before,.fl::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;
 background:var(--paper);top:50%;margin-top:-7px}
.fl::before{left:-8px}.fl::after{right:-8px}
.fl .lb{font-size:8px;letter-spacing:2.5px;color:var(--teal);font-weight:800}
.fl .rt{display:flex;align-items:center;gap:8px;margin-top:8px}
.fl .ia{font-size:23px;font-weight:900;letter-spacing:-1px}
.fl .ct{font-size:8px;color:var(--sub)}
.fl .mid{flex:1;text-align:center}
.fl .ln{height:1px;background:linear-gradient(90deg,var(--teal),var(--gold));position:relative;margin:4px 0}
.fl .ln::after{content:'✈';position:absolute;right:-5px;top:-8px;font-size:11px;color:var(--gold)}
.fl .nm{font-size:9px;font-weight:800;color:#b5541f;letter-spacing:1px}
.fl .bt{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);
 margin-top:8px;border-top:1px dashed var(--edge);padding-top:7px}
.fl .bt b{color:var(--teal)}
.barcode{height:24px;margin-top:11px;background:repeating-linear-gradient(90deg,
 #2b2b2b 0 2px,transparent 2px 4px,#2b2b2b 4px 5px,transparent 5px 9px);opacity:.5}

.ht{border-left:4px solid var(--gold);background:#fffdf7;border-radius:0 10px 10px 0;
 padding:16px 18px;margin-top:16px}
.ht .hn{font-size:16px;font-weight:800;color:#1f3b3b}
.ht .hs{font-size:11.5px;color:var(--dim);margin:3px 0 9px}
.ht .hr{display:flex;gap:8px;font-size:11.8px;color:var(--sub);line-height:1.75;margin-top:5px}
.ht .hr i{font-style:normal;flex-shrink:0}

/* ---------- controls ---------- */
.arrows{display:flex;gap:9px;align-items:center;margin-top:13px}
.arrows button{border:1px solid #ffffff26;background:#ffffff10;color:#c9d8d6;border-radius:20px;
 padding:6px 17px;font-size:12.5px;cursor:pointer;font-weight:700;backdrop-filter:blur(4px)}
.arrows button:disabled{opacity:.25;cursor:default}
.pgn{color:#7d9391;font-size:11px;letter-spacing:2px;min-width:54px;text-align:center}
.hint{color:#6c8482;font-size:10px;margin-top:10px;letter-spacing:1px;text-align:center}
@media(max-width:560px){
 body{padding:6px 0 10px}
 /* 標籤：單排橫向捲動，不再擠成三行 */
 .topbar{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;
  padding:4px 12px 10px;gap:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 .topbar::-webkit-scrollbar{display:none}
 .tab{flex:0 0 auto;padding:7px 14px;font-size:12.5px}
 /* 書本佔更多高度 */
 .stage{width:94vw;height:76vh}
 .stamp{width:66px;height:66px;top:58px;right:10px}
 .dayno{font-size:33px}
 /* 底部只留進度條，翻頁靠左右滑 */
 .arrows button{display:none}
 .arrows{margin-top:9px;gap:0}
 .pgn{font-size:11px;letter-spacing:3px}
 .prog{margin-top:9px;width:94vw}
 .hint{font-size:9.5px;margin-top:7px;opacity:.75}
 .pg-in{padding:18px 15px}}

.back-btn{flex:0 0 auto;border:1px solid #ffffff2e;background:#ffffff0d;color:#8fa8a5;
 border-radius:16px;padding:5px 12px;font-size:11.5px;font-weight:700;cursor:pointer;
 text-decoration:none;white-space:nowrap;transition:.2s;
 display:inline-flex;align-items:center;margin-right:3px}
.back-btn:hover{background:#ffffff1c;color:#c9d8d6}
/* 進度條 */
.prog{width:min(420px,92vw);height:3px;background:#ffffff14;border-radius:3px;
 margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:3px;
 background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .45s ease}

const N=P.length;let cur=0;
P.forEach((p,i)=>{const el=document.createElement('div');
 el.className='page'+(p.cover?' cover':'');el.innerHTML=p.html;book.appendChild(el);
 const t=document.createElement('button');t.className='tab';t.textContent=p.tab;
 t.onclick=()=>go(i);tabs.appendChild(t);});
const pages=[...book.children],tbs=[...tabs.querySelectorAll('.tab')],
 pbar=document.getElementById('pbar');
function go(n){cur=Math.max(0,Math.min(N-1,n));
 pages.forEach((p,i)=>{p.classList.toggle('flipped',i<cur);p.style.zIndex=i<cur?i:N-i;});
 tbs.forEach((t,i)=>t.classList.toggle('on',i===cur));
 prev.disabled=cur===0;next.disabled=cur===N-1;pgn.textContent=(cur+1)+' / '+N;
 pbar.style.width=((cur+1)/N*100)+'%';
 const a=tbs[cur];
 if(cur<=1){tabs.scrollTo({left:0,behavior:'smooth'});}
 else if(a){tabs.scrollTo({left:a.offsetLeft-tabs.clientWidth/2+a.offsetWidth/2,behavior:'smooth'});}}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
pages[0].addEventListener('click',()=>{if(cur===0)go(1)});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);
 if(e.key==='ArrowLeft')go(cur-1);if(e.key==='Home')go(0);if(e.key==='End')go(N-1);});
let sx=0,sy=0;
book.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
book.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,
 dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)go(cur+(dx<0?1:-1))},{passive:true});
go(0);
